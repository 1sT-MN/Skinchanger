name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '**/LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '**/LICENSE'

env:
  BUILD_NUMBER: ${{ github.run_number }}
  PROJECT_PATH: "WeaponPaints.csproj"
  PROJECT_NAME: "WeaponPaints"
  OUTPUT_PATH: "./WeaponPaints"
  UPSTREAM_DATA_PATH: "./upstream-weaponpaints/website/data"
  UPSTREAM_REF: "fa8936f3959310acf94de410bc5bd0015f34ff24"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -c WeaponPaints -o ${{ env.OUTPUT_PATH }}

  publish:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Checkout upstream catalog data
      uses: actions/checkout@v4
      with:
        repository: Nereziel/cs2-WeaponPaints
        ref: ${{ env.UPSTREAM_REF }}
        path: upstream-weaponpaints
        sparse-checkout: website/data
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -c WeaponPaints -o ${{ env.OUTPUT_PATH }}
    - name: Clean files
      run: |
        rm -f \
          ${{ env.OUTPUT_PATH }}/CounterStrikeSharp.API.dll \
          ${{ env.OUTPUT_PATH }}/McMaster.NETCore.Plugins.dll \
          ${{ env.OUTPUT_PATH }}/Microsoft.DotNet.PlatformAbstractions.dll \
          ${{ env.OUTPUT_PATH }}/Microsoft.Extensions.DependencyModel.dll \
    - name: Copy catalog data
      run: |
        test -d "${{ env.UPSTREAM_DATA_PATH }}"
        mkdir -p "${{ env.OUTPUT_PATH }}/data"
        cp -R "${{ env.UPSTREAM_DATA_PATH }}/." "${{ env.OUTPUT_PATH }}/data/"
        for catalog in skins gloves agents music collectibles; do
          test -s "${{ env.OUTPUT_PATH }}/data/${catalog}_en.json"
        done
    - name: Zip
      run: zip -r "${{ env.PROJECT_NAME }}.zip" "${{ env.OUTPUT_PATH }}" gamedata/
    - name: WeaponPaints
      uses: ncipollo/release-action@v1.12.0
      with:
        artifacts: "${{ env.PROJECT_NAME }}.zip"
        name: "Build ${{ env.BUILD_NUMBER }}"
        tag: "build-${{ env.BUILD_NUMBER }}"
        body: |
          Place the plugin in game/csgo/addons/counterstrikesharp/plugins/WeaponPaints
